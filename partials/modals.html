<!-- Video modal (YouTube, privacy-enhanced mode, loaded only on click) -->
<dialog class="modal" data-video-modal aria-label="Video player">
  <div class="modal__frame"></div>
  <button class="modal__close" type="button" data-modal-close aria-label="Close video">Close ✕</button>
</dialog>
<!-- Lightbox -->
<dialog class="lightbox" data-lightbox-modal aria-label="Image viewer" aria-roledescription="carousel">
  <div class="lb__stage" data-cursor="Drag"><div class="lb__track" aria-live="polite"></div></div>
  <div class="lb__meta"><p class="lightbox__cap"></p><div class="lb__dots" aria-hidden="true"></div></div>
  <button class="lightbox__nav lightbox__prev" type="button" data-lb-prev aria-label="Previous image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="lightbox__nav lightbox__next" type="button" data-lb-next aria-label="Next image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <button class="modal__close" type="button" data-modal-close aria-label="Close image viewer">Close ✕</button>
</dialog>
