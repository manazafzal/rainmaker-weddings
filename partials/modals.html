<!-- Video modal (YouTube, privacy-enhanced mode, loaded only on click) -->
<dialog class="modal" data-video-modal aria-label="Video player">
  <div class="modal__frame"></div>
  <button class="modal__close" type="button" data-modal-close aria-label="Close video">Close ✕</button>
</dialog>
<!-- Lightbox -->
<dialog class="lightbox" data-lightbox-modal aria-label="Image viewer">
  <figure class="lightbox__fig"><img class="lightbox__img" src="" alt=""><figcaption class="lightbox__cap"></figcaption></figure>
  <button class="lightbox__nav lightbox__prev" type="button" data-lb-prev aria-label="Previous image">←</button>
  <button class="lightbox__nav lightbox__next" type="button" data-lb-next aria-label="Next image">→</button>
  <button class="modal__close" type="button" data-modal-close aria-label="Close image viewer">Close ✕</button>
</dialog>
